# Builds the dll when triggered manually and publishes it, together with the MFG program data, as a release
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild dlssg-to-xefg.sln -p:Configuration=Release -p:Platform=x64 -m

      # msbuild already runs the project's GenerateXeFgPrograms target. Run the generator again so a build
      # that skipped it still publishes the pinned programs and tensor-core fatbin; it is a no-op when current.
      - name: Generate XeFG MFG programs
        shell: pwsh
        run: ./tools/GenerateXeFgPrograms.ps1 -Output bin\Release\xefg_mfg_programs -Cache obj\Release\packages

      - name: Package
        shell: pwsh
        run: |
          $zip = Join-Path $PWD "dlssg-to-xefg-${{ github.run_number }}.zip"
          $stage = Join-Path $PWD "staging"
          $dlssg = Join-Path $stage "XeMFG XMX\dlssg"
          $programs = Join-Path $dlssg "xefg_mfg_programs"
          New-Item -ItemType Directory -Path $programs -Force | Out-Null

          Copy-Item bin\Release\dlssg_to_xefg_intel_is_better.dll $dlssg
          Copy-Item bin\Release\xefg_mfg_programs\* $programs -Recurse

          if (-not (Test-Path (Join-Path $programs "programs.tsv"))) { throw "The XeFG MFG program set was not generated" }
          if (-not (Test-Path (Join-Path $programs "LICENSE"))) { throw "The XeFG MFG program LICENSE is missing" }
          if (-not (Test-Path (Join-Path $programs "xefg_cuda_layers.fatbin"))) { throw "The XeFG tensor-core fatbin was not generated" }

          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::Open($zip, [System.IO.Compression.ZipArchiveMode]::Create)
          try {
            Get-ChildItem -Path (Join-Path $stage "XeMFG XMX") -Recurse -File | ForEach-Object {
              # Use forward slashes so the zip extracts correctly on all platforms.
              $entryName = $_.FullName.Substring($stage.Length + 1).Replace("\", "/")
              [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($archive, $_.FullName, $entryName) | Out-Null
            }
          } finally {
            $archive.Dispose()
          }
          "ZIP=$zip" >> $env:GITHUB_ENV

      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          gh release create "build-${{ github.run_number }}" $env:ZIP `
            --target "${{ github.sha }}" `
            --title "Build ${{ github.run_number }} ($sha)" `
            --notes "Built from $sha."
